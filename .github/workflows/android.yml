name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.yml'
      - 'gradle.properties'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Avoid android-actions/setup-android@v3: it requests the removed
      # legacy "tools" package on current Android SDK repositories.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: '"$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happ-proxy-finder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
