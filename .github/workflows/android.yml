name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.yml'
      - 'gradle.properties'
      - 'README.md'

  pull_request:
    branches: [ main, master ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.yml'
      - 'gradle.properties'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: happ-proxy-finder-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keep the debug signing key stable between CI builds so newer APKs can
      # update an installed copy instead of being rejected for a signature mismatch.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: happ-proxy-finder-debug-signing-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000 -keyalg RSA -keysize 2048
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Avoid android-actions/setup-android@v3: it requests the removed
      # legacy "tools" package on current Android SDK repositories.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: '"$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"'

      - name: Run unit tests
        run: gradle testDebugUnitTest -PappVersionCode="$GITHUB_RUN_NUMBER" --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug -PappVersionCode="$GITHUB_RUN_NUMBER" --stacktrace

      - name: Verify APK update metadata
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk)"
          echo "$BADGING" | grep -F "package: name='com.happ.proxyfinder' versionCode='$GITHUB_RUN_NUMBER'"
          echo "$BADGING" | grep -F "versionName='1.10.0'"

      - name: Prepare versioned APK
        shell: bash
        run: |
          APK_NAME="Scaner-Proxy-X-v1.10.0-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scaner-Proxy-X-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          if-no-files-found: error
